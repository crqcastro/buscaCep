info:
  app:
    name: @project.name@
    artifactId: @project.artifactId@
    description: @project.description@
    version: @project.version@
    encoding: @project.build.sourceEncoding@
    java:
      version: @java.version@
server:
  port: 8083
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    configUrl: /v3/api-docs/swagger-config
    disable-swagger-default-url: true
    url: /v3/api-docs
    enabled: true
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    defaultModelsExpandDepth: -1
management:
  endpoint:
    health:
      show-details: never
      cache:
        time-to-live: "30s"
    metrics:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
spring:
  application:
    name: @project.name@
  output:
    ansi:
      enabled: always
  main:
    lazy-initialization: false
  jpa:
    open-in-view: false
    hibernate:
      dialect: org.hibernate.dialect.MySQLDialect
      ddl-auto: update
    show-sql: false
  datasource:
    username: cesarcas_logradouros
    password: A&(Ijr@FN.x.I~QM
    url: jdbc:mysql://cesarcastro.com.br:3306/cesarcas_logradouros?autoReconnect=true&useSSL=false&useTimezone=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    hikari:
      minimumIdle: 1
      idleTimeout: 10000
      connectionTimeout: 30000
      maximumPoolSize: 20
      maxLifetime: 30000
logging:
  level:
    root: error
    org.springframework.web: error
    br.com.cesarcastro.buscacep: error

app:
  endpoint-base: https://apis.cesarcastro.com.br/buscacep

viacep:
